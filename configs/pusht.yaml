# Dataset
zarr_path: data/pusht/pusht_cchi_v7_replay.zarr
obs_horizon: 2
pred_horizon: 16
action_horizon: 8
seed: 42

# Model
input_dim: 2
obs_dim: 20
global_cond_dim: 40
diffusion_step_embed_dim: 256
down_dims: [256, 512, 1024]
kernel_size: 3
n_groups: 8

# Diffusion
num_diffusion_steps: 100
noise_schedule_s: 0.008

# Optimizer
batch_size: 64
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 100
optimizer: adamw
scheduler: cosine
eta_min_ratio: 0.01
grad_clip: 1.0

# EMA
use_ema: true
ema_decay: 0.999

# Logging
log_interval: 20
save_interval: 10
output_dir: checkpoints
run_name: pusht_state_diffusion