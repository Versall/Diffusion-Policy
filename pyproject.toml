[project]
name = "diffusion-policy-push-t"
version = "0.1.0"
description = "Diffusion Policy untuk task Push-T (state-based, CUDA)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "zarr>=2.14.0",
    "gymnasium>=0.29.0",
    "gym-pusht>=0.1.5",
    "pygame>=2.5.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "Pillow>=10.0.0",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.9",
]

# ============================================================
# CUDA index — pilih sesuai driver GPU di PC remote Anda
# cu121 = CUDA 12.1, cu118 = CUDA 11.8
# ============================================================
[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu134"
explicit = true